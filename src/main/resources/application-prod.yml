spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: ${TRUSTED_PROXY_REGEX:127\.0\.0\.1|::1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}}

management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:8081}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}

logging:
  config: classpath:logback-spring.xml

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    jwt-secret: ${JWT_SECRET}
    dev-sms-code: ${DEV_SMS_CODE:}
    sms:
      gateway-url: ${SMS_GATEWAY_URL}
      gateway-token: ${SMS_GATEWAY_TOKEN}
      template-code: ${SMS_TEMPLATE_CODE:REGISTER}
  file:
    storage-type: ${FILE_STORAGE_TYPE:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:five-elements-private}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
